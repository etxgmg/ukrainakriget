name: Automatisk Uppdatering och Arkivering

on:
  schedule:
    # Körs var 4:e timme
    - cron: '0 */4 * * *'
  workflow_dispatch: # Möjliggör manuell körning via GitHub-gränssnittet

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-and-archive:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Konfigurera Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Samla in källdata och rotera arkiv
        run: |
          python3 scripts/fetch_sources.py

      - name: Validera datakvalitet och källkrav
        run: |
          python3 scripts/validate_data.py

      - name: Commit och pusha ändringar om data uppdaterats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Inga nya ändringar att spara."
          else
            git commit -m "Auto-update: Ny källdata och arkivrotation [skip ci]"
            git push
          fi

      - name: Konfigurera GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Ladda upp artefakter för Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Publicera till GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

